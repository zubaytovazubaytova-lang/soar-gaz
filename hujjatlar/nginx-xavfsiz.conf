# ════════════════════════════════════════════════════════════════════
#  SOAR GAZ — mustahkamlangan nginx sozlamasi (production)
#
#  Joylashtirish:   /etc/nginx/sites-available/soargaz
#  Tekshirish:      sudo nginx -t && sudo systemctl reload nginx
#
#  Bu fayl SERVERGA_QOYISH.md dagi nginx namunasining TO'LDIRILGAN
#  varianti. Asosiy farqlar: HTTP→HTTPS, TLS qoidalari, IP bo'yicha
#  so'rov cheklovi, maxfiy fayllar to'siq, versiya yashirilgan.
#
#  DIQQAT: HSTS, X-Frame-Options, CSP va boshqa himoya sarlavhalari
#  DJANGO TOMONIDAN beriladi (settings.py + soargaz/middleware.py).
#  Ularni bu yerda QAYTA yozmang — sarlavha ikki marta ketadi va
#  ba'zi brauzerlar ikkinchisini rad etadi.
# ════════════════════════════════════════════════════════════════════

# ── Umumiy (http {} blokiga tushadi; sites-available ichida server {}
#    dan TASHQARIDA turishi mumkin) ───────────────────────────────────

# Kirish endpointlari uchun qat'iy chegara: bir IP dan sekundiga 2 ta so'rov
# (qisqa portlashga 10 tagacha ruxsat). Django ichida ham cheklov bor
# (apps/auth_app/throttles.py), bu — undan OLDINGI, arzonroq qatlam:
# hujumchi so'rovi Python'gacha yetib bormaydi.
limit_req_zone $binary_remote_addr zone=kirish:10m rate=2r/s;
# Qolgan API uchun bir IP dan sekundiga 20 ta (oddiy foydalanuvchiga sezilmaydi)
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=ulanish:10m;

server_tokens off;      # nginx versiyasi javob sarlavhasida ko'rinmasin

# ── HTTP → HTTPS ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name soargaz.uz www.soargaz.uz;

    # Let's Encrypt tekshiruvi (certbot --webroot ishlatilsa)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://soargaz.uz$request_uri; }
}

# www → apex (bitta kanonik manzil: qidiruv tizimi va cookie uchun muhim)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.soargaz.uz;

    ssl_certificate     /etc/letsencrypt/live/soargaz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soargaz.uz/privkey.pem;

    return 301 https://soargaz.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soargaz.uz;

    # ── TLS ───────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/soargaz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soargaz.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;          # TLS 1.0/1.1 va SSL yo'q
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Hajm va vaqt chegaralari (sekin-hujum / katta so'rovdan himoya) ─
    client_max_body_size   32M;     # hujjat/rasm yuklash uchun (xodim hujjati 30 MB gacha + forma maydonlari)
    client_body_timeout    15s;
    client_header_timeout  15s;
    send_timeout           30s;
    keepalive_timeout      30s;
    limit_conn             ulanish 30;   # bir IP dan bir vaqtda 30 ulanish

    # ── Maxfiy fayllar HECH QACHON berilmasin ─────────────────────────
    # Loyiha ildizida db.sqlite3, .env, .git, venv, *.py, *.bak bor.
    # Django ularni bermaydi (faqat ruxsat etilgan yo'llar bor), lekin
    # kimdir kelajakda `root` yoki `alias` qo'shib qo'ysa — bu qoida
    # ularni baribir yopib turadi (ikkinchi himoya qatlami).
    location ~ /\.(?!well-known) { deny all; return 404; }          # .git, .env, .htaccess
    location ~* \.(py|pyc|sqlite3?|db|bak|log|sql|env|ini|toml|lock|md|txt|map)$ {
        # robots.txt va sitemap.xml ochiq bo'lishi kerak — ular Django'dan, shu sababli
        # ularning yo'li pastdagi `location /` ga o'tadi (== bilan alohida ushlanadi):
        deny all; return 404;
    }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }
    location ~ ^/(backend|node_modules|venv|hujjatlar|scripts_private)/ { deny all; return 404; }
    location = /package.json      { deny all; return 404; }
    location = /package-lock.json { deny all; return 404; }

    # Mijoz hujjatlari faqat tokenli API orqali beriladi
    location /media/kabinet_hujjatlar/ { deny all; return 404; }
    location /media/hujjatlar_maxfiy/  { deny all; return 404; }

    # Yuklangan media: brauzer uni skript sifatida bajarmasin
    location /media/ {
        alias /srv/soargaz/backend/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
    location /static/ { alias /srv/soargaz/backend/static/; }

    location /assets/ {
        alias /srv/soargaz/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /vendor/ {
        alias /srv/soargaz/vendor/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker hech qachon keshlanmasin
    location = /sw.js {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Kirish endpointlari: eng qat'iy cheklov ───────────────────────
    location ~ ^/api/auth/(admin/login|admin/otp|otp/yuborish|otp/tasdiqlash|royxat|xodim/login)/ {
        limit_req zone=kirish burst=10 nodelay;
        include /etc/nginx/snippets/soargaz-proxy.conf;
    }

    # ── To'lov webhook'lari: cheklovsiz (Click/Payme bir necha marta
    #    ketma-ket yuborishi mumkin; ularni to'sib qo'ysak to'lov "osilib" qoladi)
    #    Himoya — Django ichidagi imzo va summa tekshiruvi.
    location /api/tolovlar/click/ { include /etc/nginx/snippets/soargaz-proxy.conf; }
    location /api/tolovlar/payme/ { include /etc/nginx/snippets/soargaz-proxy.conf; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/soargaz-proxy.conf;
    }

    # ── Xaridlar do'koni (Next.js) ────────────────────────────────────
    location /xaridlar/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / { include /etc/nginx/snippets/soargaz-proxy.conf; }
}

# ════════════════════════════════════════════════════════════════════
#  /etc/nginx/snippets/soargaz-proxy.conf  (alohida fayl, mazmuni:)
#
#      proxy_pass http://127.0.0.1:8001;
#      proxy_set_header Host $host;
#      proxy_set_header X-Forwarded-Proto $scheme;
#      # $remote_addr — mijoz o'zi yuborgan X-Forwarded-For ga ISHONMAYMIZ.
#      # Django NUM_PROXIES=1 bilan aynan shu bitta qiymatni oladi.
#      proxy_set_header X-Forwarded-For $remote_addr;
#      proxy_read_timeout 60s;
#      proxy_connect_timeout 5s;
# ════════════════════════════════════════════════════════════════════

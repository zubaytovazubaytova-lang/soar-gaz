<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0d6efd"/>
  <title>Internet aloqasi yo'q — SOAR GAZ</title>
  <link rel="stylesheet" href="/assets/inter.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:linear-gradient(160deg,#f2f8ff 0%,#eaf2fd 55%,#f2f8ff 100%);
      color:#1c3d63;min-height:100vh;display:flex;align-items:center;
      justify-content:center;padding:24px;
      padding-left:max(24px,env(safe-area-inset-left));
      padding-right:max(24px,env(safe-area-inset-right));
    }
    .quti{max-width:420px;width:100%;text-align:center}
    .belgi{
      width:88px;height:88px;margin:0 auto 24px;border-radius:26px;
      background:#e0ecfb;display:flex;align-items:center;justify-content:center;
      font-size:38px;
    }
    h1{font-size:22px;font-weight:700;margin-bottom:10px;line-height:1.3}
    p{font-size:15px;line-height:1.6;color:#5b7fa6;margin-bottom:26px}
    button{
      font:inherit;font-weight:600;font-size:15px;cursor:pointer;
      background:#0d6efd;color:#fff;border:0;border-radius:14px;
      padding:14px 28px;min-height:48px;width:100%;
      transition:background .15s ease;
    }
    button:active{background:#0b5ed7}
    .tel{margin-top:22px;font-size:14px;color:#5b7fa6}
    .tel a{color:#0d6efd;font-weight:600;text-decoration:none}
    @media (max-width:380px){ h1{font-size:19px} }
  </style>
</head>
<body>
  <div class="quti">
    <div class="belgi">📡</div>
    <h1>Internet aloqasi yo'q</h1>
    <p>
      Sahifani ko'rsatish uchun aloqa kerak. Mobil internet yoki Wi-Fi
      yoqilganini tekshiring va qaytadan urinib ko'ring.
    </p>
    <button data-h-click="h1">Qayta urinish</button>
    <div class="tel">
      Shoshilinch holatda: <a href="tel:+998918341104">+998 91 834 11 04</a>, <a href="tel:+998954801104">+998 95 480 11 04</a>
    </div>
  </div>

  <script src="/scripts/hodisa-boshqaruvchi.js?v=1"></script>
<script src="/scripts/offline-asosiy.js?v=1"></script>
<script src="/scripts/offline-hodisalar.js?v=1"></script>
</body>
</html>
